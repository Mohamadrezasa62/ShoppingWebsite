name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shopping
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopping -d shopping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ci-password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      AUTH_REDIS_TEST_URL: redis://localhost:6379/1
      SMS_BACKEND: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate
      - run: python backend/manage.py seed_roles
      - run: python backend/manage.py seed_demo
      - run: python backend/manage.py seed_demo
      - run: python backend/manage.py test accounts catalog commerce operations sellers payments

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:payments
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Build and start services
        run: docker compose up --build --detach
      - name: Check API, frontend, and proxy
        run: |
          curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:5068/ready/
          curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:5067/
          curl --fail http://localhost:5067/api/v1/auth/csrf/
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: docker compose down

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shopping_e2e
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopping -d shopping_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: browser-ci-only-not-for-production
      POSTGRES_DB: shopping_e2e
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ci-password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      ENABLE_SANDBOX_PAYMENTS: "1"
      E2E_FIXTURES: "1"
      API_INTERNAL_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Prepare disposable browser fixture
        run: |
          python backend/manage.py migrate
          python backend/manage.py seed_e2e --output "$RUNNER_TEMP/shopping-e2e-sessions.json"
      - run: npm run build -- --webpack
        working-directory: frontend
      - name: Run mobile marketplace browser flow
        env:
          E2E_SESSION_FILE: ${{ runner.temp }}/shopping-e2e-sessions.json
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/backend-e2e.log" 2>&1 &
          BACKEND_PID=$!
          npm --prefix frontend run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/frontend-e2e.log" 2>&1 &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true; rm -f "$E2E_SESSION_FILE"' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/ready/ > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:e2e
