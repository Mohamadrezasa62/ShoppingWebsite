name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shopping
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopping -d shopping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ci-password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      SMS_BACKEND: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate
      - run: python backend/manage.py seed_roles
      - run: python backend/manage.py test accounts catalog commerce operations sellers

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare development environment
        run: cp .env.example .env
      - name: Build and start services
        run: docker compose up --build --detach
      - name: Check API, frontend, and proxy
        run: |
          curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:8000/ready/
          curl --fail --retry 20 --retry-connrefused --retry-delay 3 http://localhost:3000/
          curl --fail http://localhost:3000/api/v1/auth/csrf/
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
